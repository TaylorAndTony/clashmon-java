<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>订阅监控</title>
    <!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"-->
    <!--          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">-->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <script src="/js/sweetalert2@11.js"></script>
    <style>
        .digit {
            font-size: 2rem;
            font-weight: bold;
        }

        .title {
            font-size: 1.5rem;
        }

        div.swal2-container > div {
            background: #00213d !important;
            color: white !important;
        }
    </style>
</head>
<body>
<div class="container">

    <h1 style="margin: 30px 0;">订阅监控</h1>

    <ul class="nav">
        <li class="nav-item">
            <a class="nav-link" href="/">订阅监控</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/manage">管理订阅</a>
        </li>
    </ul>

    <div class="container mt-12">
        <h2>添加订阅</h2>
        <form>
            <div class="mb-3">
                <label for="sub-link" class="form-label mb-2">订阅链接</label>
                <input type="text" name="link" class="form-control" id="sub-link" placeholder="https://xxx.com">
            </div>
            <div class="mb-3">
                <label for="sub-link-desc" class="form-label mb-2">备注</label>
                <input type="text" name="desc" class="form-control" id="sub-link-desc">
            </div>
            <button type="submit" class="btn-solid theme-primary mt-2">添加订阅</button>
        </form>
    </div>

    <div class="container mt-12">
        <h2>管理订阅</h2>
        <div>
            <div th:each="url: ${urlList}">
                <div class="card mb-3">
                    <div class="card-body">
                        <div>
                            <span style="font-weight: bold;" class="mr-4" th:text="${url.getDescription()}">Clash default</span>
                            <a class="" th:text="${url.getUrl()}">https://23322323.321132/sfdsdf</a>
                        </div>
                        <div>
                            <button onclick="update_(this)" type="button" class="btn-solid theme-primary mr-4"
                                    th:attr="data-id=${url.getId()}, data-link=${url.getUrl()}, data-desc=${url.getDescription()}">更新
                            </button>
                            <button onclick="delete_(this)" type="button" class="btn-solid theme-danger"
                                    th:attr="data-id=${url.getId()}, data-link=${url.getUrl()}">删除
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



</div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    async function update_(button) {
        const link = button.getAttribute('data-link')
        const id = button.getAttribute('data-id')
        const desc = button.getAttribute('data-desc')
        console.log(id, link)
        const inputValue = link;
        const { value: ipAddress } = await Swal.fire({
            title: "修改地址",
            input: "text",
            inputLabel: "新的地址",
            inputValue,
            showCancelButton: true,
            inputValidator: (value) => {
                if (!value) return "必须填写新的地址";
            }
        });
        console.log(ipAddress)
        if (!ipAddress) {
            return;
        }

        const { value: newDesc } = await Swal.fire({
            title: "修改备注",
            input: "text",
            inputLabel: "新的备注",
            desc,
            showCancelButton: true,
        });
        console.log('new desc: ', newDesc);
        /**
         *     @PostMapping("update/{id}")
         *     public Map<String, Object> update(@PathVariable Long id, @RequestBody Map<String, Object> data) {
         *         /**
         *          * {
         *          *   "url": "xxx",
         *          *   "desc": "xxx"
         *          * }
         *
         */
        if (ipAddress && newDesc) {
            const data = {
                url: ipAddress,
                desc: newDesc
            };
            fetch(`/api/update/${id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Success:', data);
                    if (data.success) {
                        window.location = '/manage';
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: '更新失败',
                            text: data.message
                        });
                    }
                })
        }
    }

    function delete_(button) {
        const link = button.getAttribute('data-link')
        const id = button.getAttribute('data-id')
        console.log(id, link)
        if (!confirm('确定要删除吗？')) return;
        fetch(`/api/delete/${id}`, {method: 'DELETE'})
            .then(response => {
                if (response.ok) {
                    window.location = '/manage';
                }
            })
    }
</script>
</body>
</html>
