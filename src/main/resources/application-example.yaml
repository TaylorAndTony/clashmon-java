spring:
  application:
    name: clashmon
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/clashmon?useUnicode=true&characterEncoding=utf-8&useSSL=true
    username: 'root'
    password: '1111'
  sql:
    init:
      mode: always # schema.sql
server:
  port: 8081

mybatis:
  mapper-locations: classpath:/mapper/*.xml  # mapper/xxx.xml
  type-aliases-package: com.mine.pojo
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl